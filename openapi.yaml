openapi: 3.0.0
info:
  title: Product Service API
  version: "1.0.0"
  description: API for retrieving product information.
servers:
  - url: https://na8lu42om2.execute-api.us-east-1.amazonaws.com/prod
    variables:
      apiId:
        default: na8lu42om2
      region:
        default: us-east-1
paths:
  /products:
    get:
      summary: Retrieve the list of products
      responses:
        '200':
          description: A JSON array of product objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products/{productId}:
    get:
      summary: Retrieve a single product by its ID
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single product object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
